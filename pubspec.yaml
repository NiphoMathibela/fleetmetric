name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.17.2
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  fl_chart: ^1.2.0
  intl: ^0.19.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  file_picker: ^8.1.2
  google_generative_ai: ^0.4.5
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-1024.png"
  remove_alpha_ios: true
  # Configuration for Android adaptive icons
  adaptive_icon_background: "assets/android_background.png"
  adaptive_icon_foreground: "assets/icon-512.png"
  # Optional: Windows icons
  windows:
    generate: true
    image_path: "assets/icon-1024.png"
    icon_size: 256 # Minimum 48, maximum 256

flutter:
  uses-material-design: true

  # Declare the assets folder to access images inside your app
  assets:
    - assets/
